spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=LEGACY;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#spring.jpa.hibernate.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.h2=null
spring.jpa.console.enabled=true
spring.jpa.show-sql=true



spring.logging.level.org.springframework=info
spring.logging.level.web=debug

spring.flyway.user=sa
spring.flyway.password=sa
spring.flyway.schemas=test
spring.flyway.url=jdbc:h2:mem:test
spring.flyway.locations=filesystem:db/migration
spring.flyway.enabled=false


