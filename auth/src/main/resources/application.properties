spring.datasource.driverClassName=org.h2.Driver

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

#spring.jpa.hibernate.ddl-auto = UPDATE

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.jpa.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true



#to avoid 500 error
eureka.instance.prefer-ip-address=true

spring.logging.level.org.springframework=info
spring.logging.level.web=debug

#logging.level.root=DEBUG
logging.level.com.mentoring.service.payload.request.LoginRequest=DEBUG
logging.level.com.mentoring.service.jwt.JwtUtils=DEBUG
logging.level.com.mentoring.config.WebSecurityConfig=DEBUG


#spring.logging.level.org.springframework.cloud.auth=DEBUG
#spring.logging.level.reactor.netty.http.client=DEBUG